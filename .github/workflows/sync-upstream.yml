name: Yaklang Engine Sync, Auto-Translate & Release (English)

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Release အသစ် အတင်းထုတ်မည်လား? (true ရွေးပါ)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: "https://github.com/yaklang/yaklang.git"
  UPSTREAM_BRANCH: "main"
  TARGET_BRANCH: "english-edition"

jobs:
  sync-and-translate:
    name: Sync Upstream & Translate Go Source
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.check_release.outputs.release_tag }}
    steps:
      - name: 1. Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Configure Git & Sync Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/backup/workflows
          cp -r .github/workflows/* /tmp/backup/workflows/ 2>/dev/null || true
          if [ -f ".i18n_go_cache.json" ]; then
            cp .i18n_go_cache.json /tmp/backup/.i18n_go_cache.json
          fi

          git remote add upstream "${{ env.UPSTREAM_REPO }}" 2>/dev/null || git remote set-url upstream "${{ env.UPSTREAM_REPO }}"
          git fetch --no-tags --depth=1 upstream "${{ env.UPSTREAM_BRANCH }}:refs/remotes/upstream/${{ env.UPSTREAM_BRANCH }}"
          git fetch --no-tags --depth=1 origin "${{ env.TARGET_BRANCH }}:refs/remotes/origin/${{ env.TARGET_BRANCH }}" 2>/dev/null || true

          if git show-ref --verify --quiet "refs/remotes/origin/${{ env.TARGET_BRANCH }}"; then
            git show "origin/${{ env.TARGET_BRANCH }}:.i18n_go_cache.json" > /tmp/backup/.i18n_go_cache_prev 2>/dev/null || true
            if [ -s "/tmp/backup/.i18n_go_cache_prev" ]; then
              cp /tmp/backup/.i18n_go_cache_prev /tmp/backup/.i18n_go_cache.json
            fi
            git checkout -B "${{ env.TARGET_BRANCH }}" "origin/${{ env.TARGET_BRANCH }}"
            git rm -rf --quiet . || true
            git checkout "refs/remotes/upstream/${{ env.UPSTREAM_BRANCH }}" -- .
          else
            git checkout -B "${{ env.TARGET_BRANCH }}" "refs/remotes/upstream/${{ env.UPSTREAM_BRANCH }}"
          fi

          rm -rf .github/workflows/*
          mkdir -p .github/workflows
          cp -r /tmp/backup/workflows/* .github/workflows/ 2>/dev/null || true
          if [ -f "/tmp/backup/.i18n_go_cache.json" ]; then
            cp /tmp/backup/.i18n_go_cache.json .i18n_go_cache.json
          fi

      - name: 3. Setup Python for Go Source Translation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Install Translation Dependencies
        run: |
          python3 -m pip install --upgrade pip deep-translator

      - name: 5. Safely Translate Chinese Strings in .go Files
        run: |
          python3 - << 'EOF'
          import os
          import re
          import time
          import json
          from deep_translator import GoogleTranslator

          translator = GoogleTranslator(source='zh-CN', target='en')
          zh_char_re = re.compile(r'[\u4e00-\u9fff]')
          go_string_re = re.compile(r'"([^"\\]*(?:\\.[^"\\]*)*[\u4e00-\u9fff]+[^"\\]*(?:\\.[^"\\]*)*)"')

          CACHE_FILE = ".i18n_go_cache.json"
          cache = {}
          if os.path.exists(CACHE_FILE):
              try:
                  with open(CACHE_FILE, 'r', encoding='utf-8') as f:
                      cache = json.load(f)
              except:
                  cache = {}

          def chunk_list(lst, n):
              """Yield successive n-sized chunks from lst."""
              for i in range(0, len(lst), n):
                  yield lst[i:i + n]

          # ပထမအဆင့်: ဘာသာပြန်ရန်လိုအပ်သော စာသားများအားလုံးကို ရှာဖွေစုဆောင်းခြင်း
          strings_to_translate = set()
          go_files = []

          print("Phase 1: Scanning for Chinese strings...")
          for root, _, files in os.walk("."):
              if "vendor" in root or ".git" in root or "node_modules" in root:
                  continue
              for f in files:
                  if f.endswith(".go") and not f.endswith("_test.go"):
                      filepath = os.path.join(root, f)
                      go_files.append(filepath)
                      with open(filepath, "r", encoding="utf-8") as file:
                          content = file.read()
                      if zh_char_re.search(content):
                          for match in go_string_re.finditer(content):
                              text = match.group(1)
                              if len(text) <= 300 and text not in cache:
                                  strings_to_translate.add(text)

          strings_list = list(strings_to_translate)
          print(f"Found {len(strings_list)} new unique strings to translate.")

          # ဒုတိယအဆင့်: Batch လိုက်စု၍ ဘာသာပြန်ခြင်း (Rate Limit သက်သာစေရန်)
          if strings_list:
              print("Phase 2: Translating in batches...")
              # တစ်ကြိမ်လျှင် စာကြောင်း ၂၀ စီ စု၍ ဘာသာပြန်မည်
              for chunk in chunk_list(strings_list, 20):
                  try:
                      # Batch Translation
                      translated_chunk = translator.translate_batch(chunk)
                      for orig, trans in zip(chunk, translated_chunk):
                          if trans:
                              cache[orig] = trans
                          else:
                              cache[orig] = orig # ဘာသာမပြန်နိုင်ပါက မူလစာသားထားမည်
                      
                      # Save cache progressively
                      with open(CACHE_FILE, "w", encoding="utf-8") as f:
                          json.dump(cache, f, ensure_ascii=False, indent=2)
                          
                      # API ကို ၃ စက္ကန့်စီ နားပေးမည်
                      time.sleep(3)
                  except Exception as e:
                      print(f"Batch translation error: {e}. Waiting 10 seconds before retrying...")
                      time.sleep(10)
                      # Error တက်ပါက တစ်ကြောင်းချင်းစီ သွားမည့် Fallback
                      for orig in chunk:
                          try:
                              cache[orig] = translator.translate(orig)
                              time.sleep(1.5)
                          except:
                              cache[orig] = orig
                              time.sleep(2)

          # တတိယအဆင့်: ဘာသာပြန်ပြီးသား စာသားများကို ဖိုင်များထဲသို့ ပြန်လည် အစားထိုးခြင်း
          print("Phase 3: Replacing strings in source files...")
          for filepath in go_files:
              with open(filepath, "r", encoding="utf-8") as file:
                  content = file.read()
              
              if not zh_char_re.search(content):
                  continue
              
              changed = False
              def replacer(match):
                  nonlocal changed
                  original = match.group(1)
                  # Cache ထဲတွင်မရှိပါက (ဥပမာ စာလုံးရေ ၃၀၀ ကျော်များ) မူလစာသားသာ ထားမည်
                  translated = cache.get(original, original)
                  
                  if translated != original and not zh_char_re.search(translated):
                      changed = True
                      translated = translated.replace('"', '\\"')
                      return f'"{translated}"'
                  return match.group(0)

              new_content = go_string_re.sub(replacer, content)
              
              if changed:
                  with open(filepath, "w", encoding="utf-8") as file:
                      file.write(new_content)
                  print(f"Translated: {filepath}")

          print("Translation complete.")
          EOF

      - name: 6. Commit and Push English Engine Source
        run: |
          git add -f .i18n_go_cache.json .github/ 2>/dev/null || true
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(i18n): sync engine upstream and translate .go sources"
          fi
          git push -u origin "${{ env.TARGET_BRANCH }}" --force

      - name: 7. Prepare Tag for Build
        id: check_release
        run: |
          EN_TAG="v$(date +'%Y.%m.%d')-engine-en"
          git tag -f "${EN_TAG}" HEAD
          git push origin "refs/tags/${EN_TAG}" --force
          echo "release_tag=${EN_TAG}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # အဆင့် (၂) - Go ဖြင့် အင်ဂျင်ကို OS မျိုးစုံအတွက် တည်ဆောက်ခြင်း
  # ---------------------------------------------------------------------------
  build-engine:
    name: Build Yaklang Engine (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: sync-and-translate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: yak_linux_amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: yak_linux_arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: yak_darwin_amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: yak_darwin_arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: yak_windows_amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: 1. Checkout Translated Source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-and-translate.outputs.release_tag }}

      - name: 2. Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' 
          cache: true

      - name: 3. Build Engine Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go mod tidy
          # Yaklang ရဲ့ အဓိက Entrypoint ဖြစ်တဲ့ common/yak/cmd/yak.go ကို Build ခြင်း
          go build -trimpath -ldflags="-s -w" -o build/${{ matrix.output }} ./common/yak/cmd/yak.go

      - name: 4. Upload Engine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/${{ matrix.output }}

  # ---------------------------------------------------------------------------
  # အဆင့် (၃) - အင်္ဂလိပ်ဗားရှင်း အင်ဂျင်ကို Release အဖြစ် ထုတ်ပြန်ခြင်း
  # ---------------------------------------------------------------------------
  publish-engine-release:
    name: Publish English Engine Release
    needs: [sync-and-translate, build-engine]
    runs-on: ubuntu-latest
    steps:
      - name: 1. Download All Compiled Engines
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: release-assets
          merge-multiple: true

      - name: 2. Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.sync-and-translate.outputs.release_tag }}
          name: "Yaklang Engine English Edition (${{ needs.sync-and-translate.outputs.release_tag }})"
          overwrite: true
          body: |
            ### Yaklang Core Engine (English Edition)
            * Translated `.go` source files into English.
            * Pre-compiled standalone binaries for Yakit Integration.
          draft: false
          prerelease: false
          files: release-assets/*
