name: 1. Progressive Translate

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Release အသစ် အတင်းထုတ်မည်လား? (true ရွေးပါ)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: "https://github.com/yaklang/yaklang.git"
  UPSTREAM_BRANCH: "main"
  TARGET_BRANCH: "english-edition"

jobs:
  sync-and-translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}
      - name: Configure Git & Sync Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # [အဆင့် ၁] မိမိ၏ ကိုယ်ပိုင် Workflow ဖိုင် (၂) ဖိုင်ကို သီးသန့် Backup ယူမည်
          mkdir -p /tmp/backup
          cp .github/workflows/1-sync-translate.yml /tmp/backup/ 2>/dev/null || true
          cp .github/workflows/2-build-release.yml /tmp/backup/ 2>/dev/null || true
          if [ -f ".i18n_go_cache.json" ]; then
            cp .i18n_go_cache.json /tmp/backup/.i18n_go_cache.json
          fi

          # [အဆင့် ၂] Upstream (မူရင်း) မှ ကုဒ်အသစ်များကို ဆွဲယူမည်
          git remote add upstream "${{ env.UPSTREAM_REPO }}" 2>/dev/null || git remote set-url upstream "${{ env.UPSTREAM_REPO }}"
          git fetch --no-tags --depth=1 upstream "${{ env.UPSTREAM_BRANCH }}:refs/remotes/upstream/${{ env.UPSTREAM_BRANCH }}"
          git fetch --no-tags --depth=1 origin "${{ env.TARGET_BRANCH }}:refs/remotes/origin/${{ env.TARGET_BRANCH }}" 2>/dev/null || true

          if git show-ref --verify --quiet "refs/remotes/origin/${{ env.TARGET_BRANCH }}"; then
            git checkout -B "${{ env.TARGET_BRANCH }}" "origin/${{ env.TARGET_BRANCH }}"
            git rm -rf --quiet . || true
            git checkout "refs/remotes/upstream/${{ env.UPSTREAM_BRANCH }}" -- .
          else
            git checkout -B "${{ env.TARGET_BRANCH }}" "refs/remotes/upstream/${{ env.UPSTREAM_BRANCH }}"
          fi

          # [အဆင့် ၃] Upstream မှ ပါလာသော Workflow ဖိုင်များ အားလုံးကို ရှင်းလင်းမည် (အရေးကြီးဆုံးအဆင့်)
          rm -rf .github/workflows/*
          mkdir -p .github/workflows

          # [အဆင့် ၄] Backup ယူထားသော မိမိ၏ ဖိုင် (၂) ဖိုင်ကိုသာ ပြန်ထည့်မည်
          cp /tmp/backup/1-sync-translate.yml .github/workflows/ 2>/dev/null || true
          cp /tmp/backup/2-build-release.yml .github/workflows/ 2>/dev/null || true
          
          if [ -f "/tmp/backup/.i18n_go_cache.json" ]; then
            cp /tmp/backup/.i18n_go_cache.json .i18n_go_cache.json
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install deep-translator

      - name: Progressive Translation Script
        id: translate
        run: |
          # ... (ယခင် Python Script အတိုင်း အတိအကျ ထည့်ပါ) ...
          # ပြီးဆုံးပါက is_complete ကို output အနေဖြင့် ထုတ်ပေးပါမည်

      - name: Commit Cache or Fully Localized Code
        run: |
          git add -f .i18n_go_cache.json .github/ 2>/dev/null || true
          if [ "${{ steps.translate.outputs.is_complete }}" == "false" ]; then
            git commit -m "chore(i18n): save translation progress (incomplete) [skip ci]" || true
            git push -u origin "${{ env.TARGET_BRANCH }}" --force
          else
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "feat(i18n): translation 100% complete"
            fi
            git push -u origin "${{ env.TARGET_BRANCH }}" --force
          fi

      - name: Trigger Build & Release Workflow (Push Tag)
        if: steps.translate.outputs.is_complete == 'true' || inputs.force_release == true
        run: |
          EN_TAG="v$(date +'%Y.%m.%d')-engine-en"
          git tag -f "${EN_TAG}" HEAD
          git push origin "refs/tags/${EN_TAG}" --force
          echo "Tag $EN_TAG pushed successfully. Build workflow will start automatically."
